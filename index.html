<title>Шаг в фармацию</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: white page, thin top bar, one content column (max 1040px).
   Home: two coloured tiles (yellow = game for grades 1-4, green = test for grades 8-9).
   Test: one question per screen, plain lettered options like a printed school test.
   Game: visitor at the pharmacy counter on the left, wooden shelves on the right.
   One light theme on purpose: it is a school page with drawn illustrations. */
:root{
  color-scheme:light;
  --paper:#FFFFFF; --wash:#F1F5F2; --wash-2:#E3EBE5; --ink:#22302A; --muted:#5B6A62; --rule:#D3DDD6;
  --green:#16955A; --green-dk:#0E7444; --green-wash:#DFF2E7;
  --yellow:#FFC93E; --yellow-wash:#FFF2CC;
  --red:#E04B3B; --red-wash:#FCE4E0;
  --blue:#3C8AD6; --blue-wash:#E3F0FB;
  --wood:#B07A4F; --wood-wash:#F4E7D5;
  --f:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
svg.s{display:block;width:100%;height:auto}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--green-dk)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}

/* top bar */
.top{border-bottom:1px solid var(--rule);background:var(--paper)}
.top-in{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.logo .lg{width:32px;flex:none}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.where{font-size:.92rem;color:var(--muted);font-weight:500}
.link{background:none;border:0;padding:6px 2px;color:var(--green-dk);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.score{display:inline-flex;align-items:center;gap:6px;font-weight:700;padding:6px 10px;border-radius:8px;background:var(--wash);font-variant-numeric:tabular-nums}
.score .ic{width:18px}
.score.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.18)}}
.iconbtn{width:40px;height:40px;border-radius:8px;border:2px solid var(--rule);background:var(--paper);display:grid;place-items:center;cursor:pointer;padding:7px}

/* common */
.main{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
.kicker{font-size:.95rem;font-weight:600;color:var(--green-dk)}
h1{font-size:clamp(1.95rem,5vw,2.7rem);font-weight:800;letter-spacing:-.01em;margin-top:6px}
.lead{font-size:1.1rem;color:var(--muted);margin-top:12px;max-width:60ch}
h3{font-size:1.15rem;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;border:0;border-radius:8px;padding:12px 24px;font-weight:700;font-size:1rem;cursor:pointer;min-height:48px;text-decoration:none}
.btn:hover{background:var(--green-dk)}
.btn[disabled]{background:#A9C9B6;cursor:not-allowed}
.btn-line{background:var(--paper);color:var(--ink);border:2px solid var(--rule)}
.btn-line:hover{background:var(--wash)}
.small{font-size:.92rem;color:var(--muted)}
ul.plain{margin:10px 0 0;padding-left:20px;display:grid;gap:4px}
.fade{animation:fade .25s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}}

/* home */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.tile{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.tile:hover{border-color:var(--ink)}
.tile-game{background:var(--yellow-wash)}
.tile-test{background:var(--green-wash)}
.tile-art{padding:18px 18px 0}
.tile-body{padding:14px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.age{align-self:flex-start;font-weight:700;font-size:.9rem;background:var(--paper);border-radius:6px;padding:3px 10px}
.tile h2{font-size:1.4rem;font-weight:800}
.tile .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.home-note{margin-top:22px}

/* test intro */
.intro{display:grid;grid-template-columns:1.15fr 1fr;gap:36px;align-items:start}
.intro-art{border-radius:12px;padding:14px 14px 4px}
.intro-art.green{background:var(--green-wash)}
.intro-art.yellow{background:var(--yellow-wash)}
.intro h3{margin-top:22px}
.intro .btn{margin-top:22px}
.intro .small{margin-top:14px;max-width:56ch}

/* question */
.q{max-width:740px}
.q-meta{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;color:var(--muted);font-weight:600}
.progress{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-top:8px}
.progress i{height:6px;border-radius:2px;background:var(--wash-2)}
.progress i.done{background:var(--green)}
.progress i.now{background:var(--ink)}
.q h2{font-size:clamp(1.3rem,3.6vw,1.7rem);font-weight:700;margin-top:26px}
.q h2:focus{outline:none}
.q .sub{color:var(--muted);margin-top:6px}
.opts{display:grid;gap:8px;margin-top:20px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:grid;grid-template-columns:22px 1.3em 1fr;align-items:start;gap:10px;padding:13px 14px;background:var(--paper);border:2px solid var(--rule);border-radius:8px;text-align:left;cursor:pointer;line-height:1.35}
.opt:hover{border-color:var(--green)}
.mark{width:22px;height:22px;border:2px solid #8A9A91;border-radius:50%;display:grid;place-items:center;background:var(--paper)}
.multi .mark{border-radius:5px}
.letter{color:var(--muted);font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--green-wash)}
.opt[aria-pressed="true"] .mark{border-color:var(--green);background:var(--green)}
.opt[aria-pressed="true"] .mark::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.multi .opt[aria-pressed="true"] .mark::after{width:10px;height:5px;border-radius:0;background:none;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.opt.off{opacity:.45}
.opt.right{border-color:var(--green);background:var(--green-wash)}
.opt.wrong{border-color:var(--red);background:var(--red-wash)}
.counter{font-size:.92rem;color:var(--muted);margin-top:10px}
.counter.warn{color:var(--red);font-weight:600}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px}
.slider{margin-top:22px;max-width:640px}
.slider .val{font-size:1.25rem;font-weight:800}
.slider .cap{color:var(--muted)}
input[type=range]{width:100%;margin:20px 0 6px;accent-color:var(--green);height:28px;cursor:pointer}
.ticks{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);gap:4px;line-height:1.2}
.ticks span{flex:1;text-align:center}
.ticks span:first-child{text-align:left}
.ticks span:last-child{text-align:right}
.pairs{display:grid;gap:10px;margin-top:20px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.pair .or{align-self:center;color:var(--muted);font-size:.9rem}
.side{padding:13px 12px;border:2px solid var(--rule);border-radius:8px;background:var(--paper);cursor:pointer;line-height:1.3}
.side:hover{border-color:var(--green)}
.side[aria-pressed="true"]{border-color:var(--green);background:var(--green-wash);font-weight:700}
.fb{margin-top:16px;padding:14px 16px;border-radius:8px;background:var(--wash)}
.fb b{display:block;margin-bottom:2px}

/* fact */
.fact{display:grid;grid-template-columns:116px 1fr;gap:24px;align-items:center;background:var(--green);color:#fff;border-radius:12px;padding:28px;max-width:820px}
.fact .fart{background:#fff;border-radius:50%;padding:16px}
.fact-k{font-weight:700;opacity:.9}
.fact-t{font-size:clamp(1.2rem,3.4vw,1.5rem);font-weight:700;line-height:1.3;margin-top:6px}
.fact-s{margin-top:12px;font-size:.92rem}
.fact-s a{color:#fff}

/* result */
.result{max-width:840px}
.rb{border-top:1px solid var(--rule);padding-top:22px;margin-top:26px}
.rb h3{margin-bottom:12px;font-size:1.2rem}
.edu-t{font-size:1.45rem;font-weight:800}
.edu-p{margin-top:6px;max-width:66ch}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:16px}
.scale div{padding:8px 4px;text-align:center;font-size:.82rem;border-radius:6px;background:var(--wash);color:var(--muted);line-height:1.2}
.scale div.on{background:var(--green);color:#fff;font-weight:700}
.dirs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.dir{display:grid;grid-template-columns:60px 1fr;gap:16px;align-items:start;padding:14px 16px;border:2px solid var(--rule);border-radius:10px}
.dir.first{border-color:var(--green);background:var(--green-wash)}
.dir .tag{font-size:.86rem;font-weight:700;color:var(--green-dk)}
.dir h4{margin:2px 0 4px;font-size:1.1rem}
.dir p{color:var(--muted);font-size:.95rem}
.fmts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fmts span{padding:6px 12px;border-radius:6px;background:var(--wash);color:var(--muted);font-size:.92rem}
.fmts span.on{background:var(--ink);color:#fff;font-weight:700}
.ptable{border:2px solid var(--rule);border-radius:10px;overflow:hidden}
.prow{display:grid;grid-template-columns:1.6fr .9fr 1.1fr;gap:16px;padding:14px 16px;border-top:1px solid var(--rule)}
.prow:first-child{border-top:0}
.prow.head{background:var(--wash);font-size:.86rem;font-weight:700;color:var(--muted);padding-block:10px}
.prow > div{min-width:0}
.prow b{display:block;font-size:1.02rem}
.prow .d{font-size:.9rem;color:var(--muted);margin-top:2px}
.pay{font-weight:800;font-size:1.1rem;color:var(--green-dk);font-variant-numeric:tabular-nums}
.note{font-size:.8rem;color:var(--muted);margin-top:2px;line-height:1.35}
.note a{color:inherit}
.etag{font-size:.94rem}
.vahta{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;margin-top:14px;padding:14px 16px;background:var(--blue-wash);border-radius:10px}
.vahta b{display:block}
ul.next{margin:0;padding-left:20px;display:grid;gap:6px}
details.src{margin-top:26px}
details.src summary{cursor:pointer;font-weight:700;color:var(--green-dk)}
details.src ul{padding-left:20px;font-size:.9rem;color:var(--muted);display:grid;gap:4px;margin:10px 0 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
textarea.copy{width:100%;min-height:150px;margin-top:12px;border:2px solid var(--rule);border-radius:8px;padding:12px;font-size:.9rem;background:var(--wash)}

/* game: intro + study */
ol.g-steps{margin:16px 0 0;padding-left:22px;display:grid;gap:8px;font-size:1.05rem;max-width:56ch}
.field{display:grid;gap:6px;margin-top:22px;max-width:340px}
.field label{font-weight:700}
.field input{border:2px solid var(--rule);border-radius:8px;padding:11px 14px;font-size:1.05rem;background:var(--paper)}
.field input:focus{border-color:var(--green);outline:none}
.teacher{margin-top:22px;padding:14px 16px;background:var(--wash);border-radius:8px;font-size:.92rem;color:var(--muted);max-width:62ch}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.rule{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:12px 16px;border-radius:10px;background:var(--yellow-wash);font-weight:600;line-height:1.35}
.rule.red{background:var(--red-wash)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:22px}
.card{perspective:900px;background:none;border:0;padding:0;cursor:pointer;height:178px;text-align:center}
.card .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card[aria-pressed="true"] .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--rule);border-radius:10px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px}
.face .ia{width:66px}
.face b{font-size:.98rem;line-height:1.2}
.face.back{transform:rotateY(180deg);background:var(--green-wash);border-color:var(--green);font-size:.88rem;line-height:1.3;font-weight:500}
.face.back b{font-size:.9rem;color:var(--green-dk)}
.card.doc .face.front{border-color:var(--red)}
.card.doc .face.back{background:var(--red-wash);border-color:var(--red)}
.card.doc .face.back b{color:#9A2A1D}
.card .seen{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--green);display:none}
.card .seen::after{content:"";position:absolute;left:6px;top:5px;width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg)}
.card.was .seen{display:block}
.study-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:22px}
.meter{flex:1;min-width:220px;font-weight:600}
.meter .t{height:10px;border-radius:5px;background:var(--wash-2);margin-top:6px;overflow:hidden}
.meter .t i{display:block;height:100%;background:var(--green);transition:width .25s}

/* game: counter */
.scene{display:grid;grid-template-columns:1fr 1.05fr;gap:18px;align-items:start}
.visit{border:2px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--paper)}
.v-top{padding:14px 18px 0;background:var(--blue-wash)}
.v-count{font-size:.9rem;font-weight:700;color:var(--muted)}
.v-row{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:end;margin-top:6px}
.v-face{width:132px}
.bubble{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:12px 14px;margin-bottom:28px;font-size:1.08rem;line-height:1.35}
.bubble::after{content:"";position:absolute;left:-9px;bottom:18px;width:14px;height:14px;background:var(--paper);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.bubble b{display:block;font-size:.95rem;color:var(--green-dk)}
.desk{background:var(--green);border-top:10px solid #1FAE6B;padding:14px 18px 18px}
.tray{background:var(--paper);border-radius:8px;padding:12px;min-height:80px}
.tray p.t{font-weight:700;font-size:.92rem;color:var(--green-dk);margin-bottom:8px}
.picked{display:flex;flex-wrap:wrap;gap:8px}
.chipi{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border:2px solid var(--green);background:var(--green-wash);border-radius:8px;font-weight:600;font-size:.92rem;cursor:pointer;line-height:1.2;text-align:left}
.chipi .ia{width:32px;flex:none}
.chipi.bad{border-color:var(--red);background:var(--red-wash)}
.chipi .x{color:var(--muted);font-weight:700;margin-left:2px}
.empty{color:var(--muted);font-size:.95rem}
.v-bottom{padding:14px 18px 18px;display:grid;gap:12px}
.msg{padding:10px 14px;border-radius:8px;font-weight:600}
.msg.no{background:var(--red-wash);color:#9A2A1D}
.msg.hint{background:var(--yellow-wash)}
.win{padding:14px 16px;border-radius:8px;background:var(--green-wash);border:2px solid var(--green);display:grid;gap:8px}
.win .pts{font-weight:800;color:var(--green-dk);font-size:1.15rem}
.v-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.remind{font-size:.88rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.remind .ia{width:26px;flex:none}
.shelves{border-radius:12px;background:var(--wood-wash);padding:14px 14px 6px}
.shelves h3{margin:0 0 6px;font-size:1rem;color:#7A5330}
.shelf-grid{display:grid;grid-template-columns:repeat(4,1fr)}
.item{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:12px 4px 10px;background:none;border:0;border-bottom:7px solid var(--wood);margin-bottom:8px;cursor:pointer;font-size:.8rem;font-weight:600;line-height:1.15;text-align:center;border-radius:6px 6px 0 0;min-height:112px}
.item .ia{width:54px;transition:transform .12s}
.item:hover .ia{transform:translateY(-3px)}
.item[aria-pressed="true"]{background:var(--green-wash)}
.item[aria-pressed="true"] .ia{opacity:.35}
.item.blink{background:var(--yellow)}
.item.blink .ia{animation:blink .9s ease-in-out infinite}
@keyframes blink{50%{transform:scale(1.12)}}

/* diploma */
.dip{max-width:700px;margin:0 auto;border:3px solid var(--green);padding:8px;border-radius:6px;background:var(--paper)}
.dip-in{border:1.5px solid var(--green);padding:clamp(20px,5vw,40px);text-align:center;border-radius:3px}
.seal{width:84px;margin:0 auto}
.dk{letter-spacing:.22em;font-weight:700;color:var(--muted);margin-top:14px;font-size:.9rem}
.dip h2{font-size:clamp(1.8rem,6vw,2.6rem);font-weight:800;color:var(--green-dk);margin-top:4px}
.to{margin-top:14px;color:var(--muted)}
.kid-name{font-size:clamp(1.5rem,5vw,2rem);font-weight:800;border-bottom:2px solid var(--rule);display:inline-block;padding:0 24px 4px;margin-top:4px;overflow-wrap:anywhere}
.stars{display:flex;justify-content:center;gap:8px;margin-top:16px}
.stars .ia{width:44px}
.dstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px auto 0;max-width:520px}
.dstats div{background:var(--wash);border-radius:8px;padding:10px 8px;font-size:.88rem;line-height:1.25}
.dstats b{display:block;font-size:1.4rem;color:var(--green-dk)}
.promise{margin:18px auto 0;max-width:46ch}
.ddate{margin-top:14px;color:var(--muted);font-size:.9rem}
.after{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}

.foot{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:16px 28px;border-top:1px solid var(--rule);font-size:.88rem;color:var(--muted)}

@media (max-width:820px){
  .scene{grid-template-columns:1fr}
}
@media (max-width:720px){
  .tiles,.intro{grid-template-columns:1fr}
  .intro-art{max-width:460px}
  .rules{grid-template-columns:1fr}
  .opts.two{grid-template-columns:1fr}
  .prow{grid-template-columns:1fr;gap:6px}
  .prow.head{display:none}
  .fact{grid-template-columns:1fr;padding:22px}
  .fact .fart{width:92px;padding:12px}
}
@media (max-width:440px){
  .shelf-grid{grid-template-columns:repeat(3,1fr)}
  .v-row{grid-template-columns:96px 1fr}
  .v-face{width:96px}
  .scale div{font-size:.72rem;padding:6px 2px}
  .dstats{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div lang="ru">
  <header class="top"><div class="top-in" id="top"></div></header>
  <main class="main" id="view"></main>
  <footer class="foot">Шаг в фармацию: проект ранней профориентации для школьников. Ответы и имена не сохраняются и никуда не отправляются.</footer>
</div>

<script>
/* ================= drawing ================= */
const INK = "#22302A";
const r2 = n => Math.round(n * 100) / 100;
function plus(cx, cy, s, fill){
  const a = s / 2, b = s * 0.18, c = r2(a - b), w = r2(2 * b);
  return `<path d="M${r2(cx - b)} ${r2(cy - a)}h${w}v${c}h${c}v${w}h-${c}v${c}h-${w}v-${c}h-${c}v-${w}h${c}z" fill="${fill}" stroke="none"/>`;
}
const GRP = inner => `<g fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${inner}</g>`;
const svg = (inner, vb) => `<svg class="s" viewBox="${vb || "0 0 64 64"}" aria-hidden="true" focusable="false">${GRP(inner)}</svg>`;
const at = (inner, x, y, s, vb) => `<svg x="${x}" y="${y}" width="${s}" height="${s}" viewBox="${vb || "0 0 64 64"}">${GRP(inner)}</svg>`;

/* ================= test: scoring ================= */
function addEff(t, e){ if(!e) return; for(const k in e) t[k] = (t[k] || 0) + e[k]; }
const MAX = (() => {
  const m = Object.fromEntries(ALL_KEYS.map(k => [k, 0]));
  for(const q of QUESTIONS) for(const k of ALL_KEYS){
    if(q.type === "single") m[k] += Math.max(0, ...q.options.map(o => (o.e || {})[k] || 0));
    else if(q.type === "multi") m[k] += q.options.map(o => (o.e || {})[k] || 0).sort((a, b) => b - a).slice(0, q.max).reduce((a, b) => a + b, 0);
    else if(q.type === "slider") m[k] += Math.max(0, ...q.stops.map(s => s.e[k] || 0));
    else if(q.type === "pairs") q.pairs.forEach(p => { m[k] += Math.max(p[0].e[k] || 0, p[1].e[k] || 0); });
  }
  return m;
})();
function totals(ans){
  const t = Object.fromEntries(ALL_KEYS.map(k => [k, 0]));
  for(const q of QUESTIONS){
    const a = ans[q.id];
    if(a == null) continue;
    if(q.type === "single") addEff(t, (q.options.find(o => o.id === a) || {}).e);
    else if(q.type === "multi") a.forEach(id => addEff(t, (q.options.find(o => o.id === id) || {}).e));
    else if(q.type === "slider") addEff(t, (q.stops[a] || {}).e);
    else if(q.type === "pairs") a.forEach((s, i) => { if(s != null) addEff(t, q.pairs[i][s].e); });
  }
  return t;
}
function computeResult(ans){
  const t = totals(ans);
  const pct = k => MAX[k] ? t[k] / MAX[k] : 0;
  const spheres = SPHERE_KEYS.map(k => ({k, p:pct(k), raw:t[k]})).sort((a, b) => b.p - a.p || b.raw - a.raw);
  const formats = FORMAT_KEYS.map(k => ({k, p:pct(k), raw:t[k]})).sort((a, b) => b.p - a.p || b.raw - a.raw);
  const sum = t.vo + t.spo, share = sum ? t.vo / sum : 0.5;
  const step = share < 0.25 ? 0 : share < 0.42 ? 1 : share < 0.58 ? 2 : share < 0.75 ? 3 : 4;
  let edu = step <= 1 ? "spo" : step === 2 ? "bridge" : "vo";
  if(t.bridge > 0 && step >= 1 && step <= 3) edu = "bridge";
  /* professions keep their curated order: the main profession of each direction comes first */
  const first = PROFS[spheres[0].k].slice(0, 3);
  const second = PROFS[spheres[1].k].filter(p => p.edu !== "none").slice(0, Math.min(2, Math.max(1, 4 - first.length)));
  const profs = [...first, ...second].slice(0, 4);
  return {t, spheres, formats, edu, step, profs, vahta:t.vahta};
}

function isAnswered(id){
  const q = QMAP[id]; if(!q) return true;
  const a = S.t.answers[id];
  if(q.type === "multi") return Array.isArray(a) && a.length > 0;
  if(q.type === "pairs") return Array.isArray(a) && a.every(x => x != null);
  return a != null;
}

function optRow(q, o, i, pressed, extra){
  return `<button type="button" class="opt ${extra || ""}" aria-pressed="${pressed}" data-act="t-pick" data-q="${q.id}" data-o="${o.id}"><span class="mark"></span><span class="letter">${LETTERS[i]})</span><span>${esc(o.t)}</span></button>`;
}
function renderQuestion(q){
  const a = S.t.answers[q.id];
  const curIdx = QUESTIONS.indexOf(q);
  const prog = QUESTIONS.map((x, i) => `<i class="${isAnswered(x.id) ? "done" : i === curIdx ? "now" : ""}"></i>`).join("");
  let body = "";
  if(q.type === "single"){
    body = `<div class="opts">${q.options.map((o, i) => optRow(q, o, i, a === o.id)).join("")}</div>`;
  } else if(q.type === "multi"){
    const sel = a || [];
    body = `<div class="opts multi ${q.two ? "two" : ""}">${q.options.map((o, i) => optRow(q, o, i, sel.includes(o.id), sel.length >= q.max && !sel.includes(o.id) ? "off" : "")).join("")}</div>
      <p class="counter" id="counter">Выбрано: ${sel.length} из ${q.max}</p>`;
  } else if(q.type === "slider"){
    const v = a == null ? q.def : a, st = q.stops[v];
    body = `<div class="slider">
      <p class="val" id="sv">${esc(st.v)}</p><p class="cap" id="sc">${esc(st.c)}</p>
      <input type="range" id="rng-${q.id}" min="0" max="${q.stops.length - 1}" step="1" value="${v}" data-q="${q.id}" aria-label="${esc(q.q)}" aria-valuetext="${esc(st.v)}">
      <div class="ticks">${q.stops.map(s => `<span>${esc(s.v)}</span>`).join("")}</div></div>`;
  } else if(q.type === "pairs"){
    const sel = a || q.pairs.map(() => null);
    body = `<div class="pairs">${q.pairs.map((p, i) => `<div class="pair" role="group" aria-label="Пара ${i + 1}">
      <button type="button" class="side" aria-pressed="${sel[i] === 0}" data-act="t-pair" data-q="${q.id}" data-i="${i}" data-s="0">${esc(p[0].t)}</button>
      <span class="or">или</span>
      <button type="button" class="side" aria-pressed="${sel[i] === 1}" data-act="t-pair" data-q="${q.id}" data-i="${i}" data-s="1">${esc(p[1].t)}</button></div>`).join("")}</div>`;
  } else if(q.type === "quiz"){
    const done = a != null;
    body = `<div class="opts">${q.options.map((o, i) => optRow(q, o, i, a === o.id, done && o.id === q.correct ? "right" : done && o.id === a ? "wrong" : "")).join("")}</div>`
      + (done ? `<div class="fb" role="status"><b>${a === q.correct ? "Верно." : "Не совсем."}</b>${esc(q.explain)}</div>` : "");
  }
  const ready = isAnswered(q.id) || q.type === "slider";
  const last = S.t.step === FLOW.length - 1;
  view.innerHTML = `<section class="q">
    <div class="q-meta"><span>Вопрос ${q.n} из ${QUESTIONS.length}</span><span>${BLOCKS[q.block]}</span></div>
    <div class="progress" aria-hidden="true">${prog}</div>
    <h2 id="qh" tabindex="-1">${esc(q.q)}</h2>
    ${q.sub ? `<p class="sub">${esc(q.sub)}</p>` : ""}
    ${body}
    <div class="nav"><button class="btn btn-line" data-act="t-back">Назад</button><button class="btn" data-act="t-next" ${ready ? "" : "disabled"}>${last ? "Показать результат" : "Далее"}</button></div>
  </section>`;
}

function renderTest(){
  const t = S.t;
  if(t.screen === "intro") return renderTestIntro();
  if(t.screen === "result") return renderResult();
  const id = FLOW[t.step];
  if(FACTS[id]) renderFact(FACTS[id]); else renderQuestion(QMAP[id]);
}
function tGo(step){
  clearTimeout(autoTimer);
  S.t.step = step; render(); toTop();
  const h = document.getElementById("qh"); if(h) h.focus({preventScroll:true});
}
function tNext(){
  const id = FLOW[S.t.step], q = QMAP[id];
  if(q && q.type === "slider" && S.t.answers[id] == null) S.t.answers[id] = q.def;
  if(q && !isAnswered(id)) return;
  if(S.t.step < FLOW.length - 1) tGo(S.t.step + 1);
  else { clearTimeout(autoTimer); S.t.screen = "result"; render(); toTop(); }
}
function tBack(){
  if(S.t.step === 0){ S.t.screen = "intro"; render(); toTop(); return; }
  tGo(S.t.step - 1);
}

  const r = computeResult(S.t.answers);

    "Формат работы: " + FORMATS[r.formats[0].k].name,
    "Профессии:"];
  r.profs.forEach(p => lines.push("- " + p.name + ": " + p.pay + " (" + EDU_TAG[p.edu].toLowerCase() + ")"));
  return lines.join("\n");
}

let actx = null;
function tone(freqs, dur, type){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, k) => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + k * dur * 0.8;
      o.type = type || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    });
  }catch(e){}
}
const sndWin = () => tone([523, 659, 784, 1047], 0.15, "triangle");
const sndNo = () => tone([220, 196], 0.18, "sine");
const sndTap = () => tone([660], 0.05, "sine");

/* ================= game: screens ================= */

  const g = S.g;
  view.innerHTML = `<section class="intro">
    <div>
      <p class="kicker">Игра для 1–4 классов</p>
      <h1>Аптека добрых советов</h1>
      <ol class="g-steps">
        <li><b>Учимся.</b> Открой карточки и узнай, что помогает при царапине, насморке и шишке.</li>
        <li><b>За первым столом.</b> К тебе придут 8 посетителей. Подбери каждому правильный совет.</li>
        <li><b>Диплом.</b> За правильные советы ты получишь баллы и диплом «Юный провизор».</li>
      </ol>
      <div class="field"><label for="kidName">Как тебя зовут?</label><input id="kidName" maxlength="24" autocomplete="off" placeholder="Имя" value="${esc(g.name)}"></div>
      <button class="btn" data-act="g-study">Начать игру</button>
    </div>
    <div class="intro-art yellow">${artGame()}</div>
  </section>`;
}
function meterHtml(){
  const n = S.g.seen.length, total = ITEM_KEYS.length, left = MIN_STUDY - n;
  return `Изучено ${n} из ${total}${left > 0 ? `. Открой ещё ${left}, чтобы начать игру.` : ". Можно начинать!"}<div class="t"><i style="width:${n / total * 100}%"></i></div>`;
}
function renderStudy(){
  const g = S.g;
  view.innerHTML = `<section>
    <p class="kicker">Шаг 1 из 3</p>
    <h1>Учимся: что от чего помогает</h1>
    <div class="rules">
      <div class="rule"><div>${svg(MISC.family)}</div><div>Лекарства выбирают только врач и взрослые.</div></div>
      <div class="rule red"><div>${svg(ITEM_ART.doctor)}</div><div>Если очень плохо или сильно болит, сразу скажи взрослым.</div></div>
    </div>
    <p class="lead">Нажми на карточку, чтобы перевернуть её.</p>
    <div class="cards">${ITEM_KEYS.map(k => {
      const it = ITEMS[k], was = g.seen.includes(k);
      return `<button type="button" class="card ${it.doc ? "doc" : ""} ${was ? "was" : ""}" data-act="g-flip" data-k="${k}" aria-pressed="false" aria-label="${esc(it.n)}">
        <span class="in"><span class="face front"><span class="seen"></span><span class="ia">${svg(ITEM_ART[k])}</span><b>${esc(it.n)}</b></span>
        <span class="face back"><b>${esc(it.n)}</b><span>${esc(it.w)}</span></span></span></button>`;
    }).join("")}</div>
    <div class="study-foot">
      <div class="meter" id="meter">${meterHtml()}</div>
      <button class="btn" id="toCounter" data-act="g-counter" ${g.seen.length >= MIN_STUDY ? "" : "disabled"}>К первому столу</button>
    </div>
  </section>`;
}
const curCase = () => CASES.find(c => c.id === S.g.round[S.g.i]);
function renderCounter(){
  const g = S.g, c = curCase();
  const wrongNow = k => g.msg && g.msg.k === "no" && !c.need.includes(k) && !c.ok.includes(k);
  const picked = g.picked.length
    ? g.picked.map(k => `<button type="button" class="chipi ${wrongNow(k) ? "bad" : ""}" data-act="g-item" data-k="${k}" aria-label="Убрать: ${esc(ITEMS[k].n)}"><span class="ia">${svg(ITEM_ART[k])}</span>${esc(ITEMS[k].n)}<span class="x" aria-hidden="true">×</span></button>`).join("")
    : `<span class="empty">Выбери на полке, что посоветовать. Можно выбрать до трёх карточек.</span>`;
  const happy = g.won > 0;
  const bottom = happy
    ? `<div class="win" role="status"><span class="pts">+${g.won} ${g.won === 10 ? "баллов, с первого раза!" : "баллов"}</span><p>${esc(c.why)}</p></div>
       <div class="v-actions"><button class="btn" data-act="g-next">${g.i >= g.round.length - 1 ? "Получить диплом" : "Следующий посетитель"}</button></div>`
    : `${g.msg ? `<div class="msg ${g.msg.k}" role="status">${esc(g.msg.t)}</div>` : ""}
       <div class="v-actions"><button class="btn" data-act="g-give" ${g.picked.length ? "" : "disabled"}>Дать совет</button>
       <span class="remind"><span class="ia">${svg(ITEM_ART.doctor)}</span>Очень плохо? Зови взрослых и врача</span></div>`;
  view.innerHTML = `<section class="scene">
    <div class="visit">
      <div class="v-top">
        <p class="v-count">Посетитель ${g.i + 1} из ${g.round.length}</p>
        <div class="v-row"><div class="v-face">${kidSvg(c.kid, happy)}</div>
          <div class="bubble"><b>${esc(c.name)}</b>${esc(happy ? g.thanks : c.say)}</div></div>
      </div>
      <div class="desk"><div class="tray"><p class="t">Твой совет</p><div class="picked">${picked}</div></div></div>
      <div class="v-bottom">${bottom}</div>
    </div>
    <div class="shelves"><h3>Полки аптеки</h3>
      <div class="shelf-grid">${ITEM_KEYS.map(k => {
        const on = g.picked.includes(k), blink = g.revealed && !happy && c.need.includes(k) && !on;
        return `<button type="button" class="item ${blink ? "blink" : ""}" data-act="g-item" data-k="${k}" aria-pressed="${on}"><span class="ia">${svg(ITEM_ART[k])}</span>${esc(ITEMS[k].n)}</button>`;
      }).join("")}</div>
    </div>
  </section>`;
}
function renderDiploma(){
  const g = S.g, max = ROUND * 10;
  const stars = g.points >= max * 0.85 ? 3 : g.points >= max * 0.55 ? 2 : 1;
  view.innerHTML = `<section>
    <div class="dip"><div class="dip-in">
      <div class="seal"><svg class="s" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="41" fill="#DFF2E7"/><circle cx="42" cy="42" r="31" fill="#16955A"/>${plus(42,42,30,"#FFFFFF")}</svg></div>
      <p class="dk">ДИПЛОМ</p>
      <h2>Юный провизор</h2>
      <p class="to">вручается</p>
      <div class="kid-name">${esc(g.name.trim() || "юному фармацевту")}</div>
      <div class="stars" aria-label="${stars} из 3 звёзд">${[0,1,2].map(i => `<span class="ia">${svg(i < stars ? MISC.star : MISC.starOff, "0 0 24 24")}</span>`).join("")}</div>
      <div class="dstats">
        <div><b>${g.helped}</b>довольных посетителей</div>
        <div><b>${g.points}</b>баллов из ${max}</div>
        <div><b>${g.firstTry}</b>советов с первого раза</div>
      </div>
      <p class="promise">Ты знаешь, что помогает при царапине, шишке и насморке, и помнишь главное правило: если очень плохо, нужно сразу сказать взрослым и обратиться к врачу.</p>
      <p class="ddate">${today()}</p>
    </div></div>
    <div class="after">
      <button class="btn" data-act="g-again">Сыграть ещё раз</button>
      <button class="btn btn-line" data-act="g-new">Новый игрок</button>
      <button class="btn btn-line" data-act="home">На главную</button>
    </div>
  </section>`;
}
function renderGame(){
  const s = S.g.screen;
  if(s === "intro") renderGameIntro();
  else if(s === "study") renderStudy();
  else if(s === "counter") renderCounter();
  else renderDiploma();
}
function makeRound(){
  const pool = CASES.filter(c => c.id !== "fever").sort(() => Math.random() - 0.5).slice(0, ROUND - 1);
  pool.splice(3 + Math.floor(Math.random() * 3), 0, CASES.find(c => c.id === "fever"));
  return pool.map(c => c.id);
}
function startRound(){
  Object.assign(S.g, {screen:"counter", round:makeRound(), i:0, picked:[], tries:0, revealed:false, won:0, thanks:"", points:0, helped:0, firstTry:0, msg:null});
  render(); toTop();
}
function gCheck(){
  const g = S.g, c = curCase(), p = g.picked;
  const wrong = p.filter(k => !c.need.includes(k) && !c.ok.includes(k));
  const missing = c.need.filter(k => !p.includes(k));
  if(!wrong.length && !missing.length){
    const pts = g.revealed ? 2 : g.tries === 0 ? 10 : 5;
    if(g.tries === 0 && !g.revealed) g.firstTry++;
    g.points += pts; g.helped++; g.won = pts; g.msg = null;
    g.thanks = THANKS[Math.floor(Math.random() * THANKS.length)];
    sndWin(); render(); bumpScores();
    return;
  }
  g.tries++; sndNo();
  if(c.serious && !p.includes("doctor")) g.msg = {k:"no", t:"Посетителю очень плохо. Вспомни главное правило!"};
  else if(wrong.length) g.msg = {k:"no", t:wrong.map(k => "«" + ITEMS[k].n + "»").join(" и ") + (wrong.length > 1 ? " здесь не помогут." : " здесь не поможет.") + " Убери лишнее и подумай ещё раз."};
  else g.msg = {k:"hint", t:missing.length === 1 ? "Почти! Нужно добавить ещё одну карточку." : "Почти! Нужно добавить ещё " + missing.length + " карточки."};
  if(g.tries >= 2 && !g.revealed){ g.revealed = true; g.msg = {k:"hint", t:"Подсказка: нужные карточки на полке подсвечены жёлтым."}; }
  render();
}
function gNext(){
  const g = S.g;
  if(g.i >= g.round.length - 1){ g.screen = "diploma"; render(); toTop(); return; }
  Object.assign(g, {i:g.i + 1, picked:[], tries:0, revealed:false, won:0, thanks:"", msg:null});
  render(); toTop();
}

/* ================= router ================= */
let lastKey = "";
function render(){
  renderBar();
  if(S.mode === "test") renderTest();
  else if(S.mode === "game") renderGame();
  else renderHome();
  /* animate only when the screen changes, not when an answer is picked */
  const key = S.mode + ":" + (S.mode === "test" ? S.t.screen + S.t.step : S.mode === "game" ? S.g.screen + S.g.i : "");
  if(key !== lastKey){ lastKey = key; const sec = view.firstElementChild; if(sec) sec.classList.add("fade"); }
}
function setMode(m){
  clearTimeout(autoTimer);
  S.mode = m;
  try { history.replaceState(null, "", m === "home" ? location.pathname + location.search : "#" + m); } catch(e){}
  render(); toTop();
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, g = S.g, t = S.t;
  switch(act){
    case "home": return setMode("home");
    case "open-test": return setMode("test");
    case "open-game": return setMode("game");

    case "t-start": t.screen = "flow"; return tGo(0);
    case "t-next": return tNext();
    case "t-back": return tBack();
    case "t-again": S.t = freshTest(); render(); return toTop();
    case "t-pick": {
      const q = QMAP[b.dataset.q], oid = b.dataset.o;
      if(q.type === "single"){
        t.answers[q.id] = oid; render();
        clearTimeout(autoTimer); autoTimer = setTimeout(tNext, 420);
      } else if(q.type === "quiz"){
        if(t.answers[q.id] != null) return;
        t.answers[q.id] = oid; render();
      } else {
        const sel = (t.answers[q.id] || []).slice(), i = sel.indexOf(oid);
        if(i >= 0) sel.splice(i, 1);
        else if(sel.length >= q.max){
          const c = document.getElementById("counter");
          if(c){ c.classList.add("warn"); c.textContent = "Можно выбрать не больше " + q.max + ". Сними отметку с одного из вариантов."; }
          return;
        } else sel.push(oid);
        t.answers[q.id] = sel; render();
      }
      return;
    }
    case "t-pair": {
      const q = QMAP[b.dataset.q], sel = (t.answers[q.id] || q.pairs.map(() => null)).slice();
      sel[+b.dataset.i] = +b.dataset.s; t.answers[q.id] = sel; render();
      return;
    }
    case "t-copy": {
      const text = resultText();
      const fallback = () => {
        document.getElementById("copyBox").innerHTML = `<textarea class="copy" id="copyText" readonly aria-label="Текст результата">${esc(text)}</textarea>`;
        const ta = document.getElementById("copyText"); ta.focus(); ta.select();
        b.textContent = "Выделите текст ниже и скопируйте";
      };
      try { navigator.clipboard.writeText(text).then(() => { b.textContent = "Скопировано"; }, fallback); } catch(e){ fallback(); }
      return;
    }

    case "g-sound": S.sound = !S.sound; return renderBar();
    case "g-study": { const inp = document.getElementById("kidName"); g.name = inp ? inp.value : g.name; g.screen = "study"; sndTap(); render(); return toTop(); }
    case "g-flip": {
      const k = b.dataset.k, on = b.getAttribute("aria-pressed") === "true";
      b.setAttribute("aria-pressed", on ? "false" : "true");
      b.classList.add("was");
      if(!g.seen.includes(k)){
        g.seen.push(k); sndTap();
        document.getElementById("meter").innerHTML = meterHtml();
        document.getElementById("toCounter").disabled = g.seen.length < MIN_STUDY;
      }
      return;
    }
    case "g-counter": return startRound();
    case "g-item": {
      if(g.won) return;
      const k = b.dataset.k, i = g.picked.indexOf(k);
      if(i >= 0) g.picked.splice(i, 1);
      else if(g.picked.length < 3) g.picked.push(k);
      else { g.msg = {k:"hint", t:"Можно выбрать не больше трёх карточек. Убери лишнюю."}; return render(); }
      if(g.msg && g.msg.t.startsWith("Можно")) g.msg = null;
      sndTap(); return render();
    }
    case "g-give": return gCheck();
    case "g-next": return gNext();
    case "g-again": return startRound();
    case "g-new": S.g = freshGame(); render(); return toTop();
  }
});
document.addEventListener("input", ev => {
  const el = ev.target;
  if(el.id === "kidName"){ S.g.name = el.value; return; }
  if(el.type === "range"){
    const q = QMAP[el.dataset.q], v = +el.value, st = q.stops[v];
    S.t.answers[q.id] = v;
    el.setAttribute("aria-valuetext", st.v);
    document.getElementById("sv").textContent = st.v;
    document.getElementById("sc").textContent = st.c;
  }
});
document.addEventListener("keydown", ev => {
  if(ev.key === "Enter" && ev.target.id === "kidName"){ ev.preventDefault(); const b = document.querySelector('[data-act="g-study"]'); if(b) b.click(); }
});

function boot(saved){
  if(saved && saved.mode) S = saved;
  else {
    const h = (location.hash || "").replace("#", "");
    if(h === "test" || h === "game") S.mode = h;
  }
  render();
}
window.claude?.hot?.snapshot?.(() => S);
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
